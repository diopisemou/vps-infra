# Maintenance timers (2026-10-24). scripts/maintenance/docker-cache-prune.sh installs a daily
# `docker builder prune --filter until=24h` on every host. Build cache is only a build speed-up,
# never needed to run anything; it had grown 5-15 GB/day on the hosts that build on-box.
# Images are deliberately NOT pruned: xaalis keeps rollback tags on purpose (~5.6 GB on prod).
maintenance:
  docker_cache_prune: daily 04:30 + jitter, all six hosts, until=24h
  os_updates: >
    unattended-upgrades applies security updates everywhere (0 security updates pending on
    2026-10-24). ~49 non-security updates wait per host, and meet-sso-misc and xaalis-prod
    need a reboot - both run production, so pick a window.
  benign_failed_units: >
    systemd-networkd-wait-online (Contabo hosts) and cloud-init-hotplugd (meet-sso-misc) show
    as failed at boot. Cosmetic: networking is up. Do not chase them.

