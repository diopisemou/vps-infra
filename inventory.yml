# Backups - activated 2026-07-30
backups:
  status: >
    restic timers enabled on all five hosts, daily 03:00 + up to 30min jitter.
    One real snapshot taken and verified per host. Repo path is
    <bucket>/<hostname>, so hostnames must stay stable.
  covered:
    - pg_dumpall / mysqldump of every running database container
    - every named docker volume, tarred
    - /etc/vps-infra, /opt/vps-infra, /opt/*/docker-compose.yml
    - /data/coolify and /etc/dokploy (PaaS control plane) when present
    - anything listed in /etc/vps-infra/backup-include.conf
  NOT_covered:
    - >
      Docker Swarm secrets on meet-sso-misc (2 of them). Swarm secrets are
      write-only by design - they cannot be read back out, so they must be
      re-created from source material at restore time. Keep that source safe.
    - >
      The restic passphrase itself. It lives only in /etc/vps-infra/r2.env, which
      IS inside the backup - but that copy is encrypted with the very passphrase
      you would be trying to recover. It must exist off-server or every snapshot
      is unreadable.
  open_risks:
    - >
      R2_ACCESS_KEY_ID was printed into journald on neobank on 2026-07-30 when a
      malformed r2.env caused bash to try executing it as a command. Rotate the
      R2 token pair.
    - >
      RESTIC_PASSWORD is 10 characters. It is the only thing protecting every
      backup at rest. Consider a longer one via 'restic key add' + 'key remove'
      (changes the passphrase without re-encrypting the data).
    - "No restore drill has been done. Until it has, treat backups as unproven."

# Network constraint that shapes how all of the above is managed.
network:
  home_egress_blocked: [22, 80, 53]
  home_egress_allowed: [443, 3000, 8000, 6001, 6002]
  diagnosis: >
    Verified 2026-07-28 from Bachir's Mac, with the Claude Code sandbox both on and
    off (identical results). github.com:22 and example.com:80 also time out, so this
    is not server-side and not a sandbox artifact - it is the router/ISP applying a
    standard residential anti-abuse block on low ports. High ports are unaffected.
  workaround: tailscale on every host; SSH runs over the tailnet instead of public :22
  update_2026_07_28: >
    Bachir switched networks and port 22 now works, so all three servers were
    bootstrapped over direct SSH. The block above is a property of his HOME
    network, not of the servers - expect it to return there. Tailscale is
    installed everywhere as durable insurance but is not logged in yet.

# Hostnames were the provider defaults (vmi34xxxxx) until 2026-07-28; renamed with
# scripts/set-hostname.sh to match the `hostname:` field above. This matters because
# backup.sh uses $(hostname) as the restic tag AND repo path.
#
# Gotchas worth remembering
gotchas:
  - >
    Contabo images ship preserve_hostname: false, so cloud-init's update_hostname
    module rewrites the hostname back to the provider default on every boot. A
    plain `hostnamectl set-hostname` looks like it worked and reverts at the next
    reboot. scripts/set-hostname.sh writes a cloud.cfg.d drop-in to prevent that.
  - >
    Coolify does NOT reference the OS hostname - its servers table points at
    host.docker.internal - so main-host was safe to rename. Dokploy DOES run on
    Docker Swarm, where the node identity is the hostname; set-hostname.sh refuses
    to run on a swarm node for that reason. meet-sso-misc was already named
    correctly, so it never needed renaming.
  - >
    Contabo images ship /etc/ssh/sshd_config.d/50-cloud-init.conf with
    PasswordAuthentication yes. sshd keeps the FIRST value it obtains and the
    Include sits at line 12, so editing sshd_config directly does nothing. We
    write 00-vps-infra.conf to win on sort order. Hetzner images have no drop-in.
  - >
    raw.githubusercontent.com caches for 5 minutes (max-age=300). Pushing a fix
    and immediately re-running bootstrap will silently execute the OLD script.
    Check the content is live before trusting a run.
