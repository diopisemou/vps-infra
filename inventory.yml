    role: main-host
    provider: contabo
    plan: "Cloud VPS 8 (2026)"
    ip: 169.58.77.127
    location: EU
    apps:
      - alminhaaj
      - FlashRide
      - better-openclaw
      - EventFlowAI
      - autostudio
      - openrevenue-bundle (convex, plunk, postiz, umami, workspace)
    paas: coolify
    backed_up: false
    observed_2026_07_28:
      bootstrap_run: true      # fixed bootstrap applied 2026-07-28, verified
      ssh: key-only (password auth off, verified with sshd -T)
      tailscale: installed, NOT logged in
      listening: [443 (traefik), 8000 (coolify ui), 6001, 6002]
      note: >
        Coolify was already installed before this bootstrap; the installer was
        skipped. All 6 coolify containers stayed healthy through the ufw change.
        8000/6001/6002 are held open explicitly - closing them loses the UI.

  - hostname: neobank
