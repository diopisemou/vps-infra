# Backups - activated 2026-07-30
backups:
  status: >
    restic timers enabled on all five hosts, daily 03:00 + up to 30min jitter.
    One real snapshot taken and verified per host. Repo path is
    <bucket>/<hostname>, so hostnames must stay stable.
  covered:
    - pg_dumpall / mysqldump of every running database container
    - every named docker volume, tarred
    - /etc/vps-infra, /opt/vps-infra, /opt/*/docker-compose.yml
    - /data/coolify and /etc/dokploy (PaaS control plane) when present
    - anything listed in /etc/vps-infra/backup-include.conf
  NOT_covered:
    - >
      Docker Swarm secrets on meet-sso-misc (2 of them). Swarm secrets are
      write-only by design - they cannot be read back out, so they must be
      re-created from source material at restore time. Keep that source safe.
    - >
      The restic passphrase itself. It lives only in /etc/vps-infra/r2.env, which
      IS inside the backup - but that copy is encrypted with the very passphrase
      you would be trying to recover. It must exist off-server or every snapshot
      is unreadable.
  open_risks:
    - >
      R2_ACCESS_KEY_ID was printed into journald on neobank on 2026-07-30 when a
      malformed r2.env caused bash to try executing it as a command. Rotate the
      R2 token pair.
    - >
      RESTIC_PASSWORD is 10 characters. It is the only thing protecting every
      backup at rest. Consider a longer one via 'restic key add' + 'key remove'
      (changes the passphrase without re-encrypting the data).
  incident_2026_10_02: >
    monitoring's restic-backup.service had failed every night since 2026-08-15: a
    restic process died holding a lock, so `forget --prune` could never run.
    Snapshots still landed (so it looked half-alive), but nothing was pruned and
    the Kuma heartbeat, which only pings on success, never fired. Lock removed
    with `restic unlock`; backup.sh now runs `restic unlock` (stale locks only)
    every time, and prunes with --group-by host so a changed path list no longer
    starts a retention group that never expires. monitoring went 60 -> 12
    snapshots. Rolled out to all six hosts, sha256 ea94196ebfe0.
  restore_drill:
    date: 2026-07-30
    method: >
      main-host's latest snapshot restored onto spare-01 with scripts/restore-drill.sh -
      a genuine cross-host restore, which is the case that matters (the original box
      is gone). 10/10 checks passed.
    proved:
      - repo opens from a DIFFERENT host using the shared passphrase
      - restic check --read-data-subset=5% found no errors
      - coolify-db.sql is a complete pg_dumpall (64 tables, matches live count of 64)
      - both docker volume tarballs are valid gzip and non-empty
      - >
        the restored Coolify APP_KEY hashes identically to the live one
        (417c6c7a7d60). This is the check that matters most: a restored .env with
        a different key would pass every other test and still leave every secret
        in coolify-db undecryptable.
    caveat: >
      Proves the DATA comes back. Does not prove a full rebuild - restoring into a
      running Coolify and having it serve apps again is a separate exercise.

