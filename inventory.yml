# Network constraint that shapes how all of the above is managed.
network:
  home_egress_blocked: [22, 80, 53]
  home_egress_allowed: [443, 3000, 8000, 6001, 6002]
  diagnosis: >
    Verified 2026-07-28 from Bachir's Mac, with the Claude Code sandbox both on and
    off (identical results). github.com:22 and example.com:80 also time out, so this
    is not server-side and not a sandbox artifact - it is the router/ISP applying a
    standard residential anti-abuse block on low ports. High ports are unaffected.
  workaround: tailscale on every host; SSH runs over the tailnet instead of public :22
  update_2026_07_28: >
    Bachir switched networks and port 22 now works, so all three servers were
    bootstrapped over direct SSH. The block above is a property of his HOME
    network, not of the servers - expect it to return there. Tailscale is
    installed everywhere as durable insurance but is not logged in yet.

# Gotchas worth remembering
gotchas:
  - >
    Contabo images ship /etc/ssh/sshd_config.d/50-cloud-init.conf with
    PasswordAuthentication yes. sshd keeps the FIRST value it obtains and the
    Include sits at line 12, so editing sshd_config directly does nothing. We
    write 00-vps-infra.conf to win on sort order. Hetzner images have no drop-in.
  - >
    raw.githubusercontent.com caches for 5 minutes (max-age=300). Pushing a fix
    and immediately re-running bootstrap will silently execute the OLD script.
    Check the content is live before trusting a run.
