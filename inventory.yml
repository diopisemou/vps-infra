# Hostnames were the provider defaults (vmi34xxxxx) until 2026-07-28; renamed with
# scripts/set-hostname.sh to match the `hostname:` field above. This matters because
# backup.sh uses $(hostname) as the restic tag AND repo path.
#
# Gotchas worth remembering
gotchas:
  - >
    Contabo images ship preserve_hostname: false, so cloud-init's update_hostname
    module rewrites the hostname back to the provider default on every boot. A
    plain `hostnamectl set-hostname` looks like it worked and reverts at the next
    reboot. scripts/set-hostname.sh writes a cloud.cfg.d drop-in to prevent that.
  - >
    Coolify does NOT reference the OS hostname - its servers table points at
    host.docker.internal - so main-host was safe to rename. Dokploy DOES run on
    Docker Swarm, where the node identity is the hostname; set-hostname.sh refuses
    to run on a swarm node for that reason. meet-sso-misc was already named
    correctly, so it never needed renaming.
  - >
    Contabo images ship /etc/ssh/sshd_config.d/50-cloud-init.conf with
    PasswordAuthentication yes. sshd keeps the FIRST value it obtains and the
    Include sits at line 12, so editing sshd_config directly does nothing. We
    write 00-vps-infra.conf to win on sort order. Hetzner images have no drop-in.
  - >
    raw.githubusercontent.com caches for 5 minutes (max-age=300). Pushing a fix
    and immediately re-running bootstrap will silently execute the OLD script.
    Check the content is live before trusting a run.

